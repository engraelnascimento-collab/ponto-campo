<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2420">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Ponto de Campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0EC; --card:#FFFFFF; --ink:#1B2420; --muted:#5A6560; --line:#CBD1CA;
  --sinal:#F2B705; --verde:#1E7A4C; --vermelho:#C0392B; --azul:#1F5F8B; --faixa:#1B2420;
  --txt:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141A17;--card:#1D2521;--ink:#E9EDE8;--muted:#9AA59F;--line:#33403A;--faixa:#0C110E}
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--txt);font-size:18px;line-height:1.4}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:3px solid var(--sinal);outline-offset:2px}
[hidden]{display:none!important}

.topo{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;
  background:var(--faixa);color:#F4F6F2;padding:8px 14px;border-bottom:4px solid var(--sinal);min-height:60px}
.marca{font-family:var(--cond);font-weight:700;font-size:1.3rem}
.nuvem{position:relative;background:transparent;border:0;font-size:2rem;line-height:1;width:56px;height:48px;color:#fff}
.badge{position:absolute;top:0;right:0;background:var(--sinal);color:#1B2420;font-weight:700;font-size:.85rem;min-width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:0 6px}

main{max-width:520px;margin:0 auto;padding:14px 14px 40px}
h2{font-family:var(--cond);font-weight:700;font-size:1.6rem;margin:16px 0 8px;line-height:1.1}
.voltar{background:var(--card);border:2px solid var(--line);border-radius:12px;width:64px;height:56px;font-size:1.8rem;line-height:1}

.placa{background:var(--sinal);color:#1B2420;border-radius:10px;padding:10px 16px;box-shadow:inset 0 0 0 3px #1B2420, inset 0 0 0 6px var(--sinal);display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.placa .hora{font-family:var(--cond);font-weight:700;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.placa .data{font-weight:700;font-size:1.1rem}

.quem{display:flex;align-items:center;gap:12px;margin:14px 0}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-weight:700;font-size:1.8rem;flex:none}
.quem b{display:block;font-size:1.3rem;line-height:1.15}
.quem small{color:var(--muted);font-size:.95rem}

.mega{width:100%;border:0;border-radius:18px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-family:var(--cond);font-weight:700;font-size:1.9rem;letter-spacing:.03em;color:#fff;margin-top:12px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.mega .ico{font-size:3.6rem;line-height:1}
.mega:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.mega.ponto{background:var(--azul)}
.mega.servico{background:var(--verde)}
.mega.enviar{background:var(--verde);min-height:110px}

.hoje{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hoje span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:1.05rem}
.bloq{text-align:center;font-size:5rem;margin-top:20px}
.engrenagem{display:block;margin:34px auto 0;background:transparent;border:0;font-size:1.4rem;opacity:.45;width:56px;height:48px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{border:3px solid var(--line);background:var(--card);border-radius:16px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--cond);font-weight:700;font-size:1.4rem}
.tile .ico{font-size:3.2rem;line-height:1}
.tile.sug{grid-column:1 / -1;min-height:170px;border-color:var(--sinal);background:var(--sinal);color:#1B2420;font-size:1.9rem}
.tile.sug .ico{font-size:4.4rem}
@media (prefers-reduced-motion:no-preference){.tile.sug{animation:chama 1.8s ease-in-out infinite}}
@keyframes chama{50%{box-shadow:0 0 0 8px rgba(242,183,5,.35)}}

.espera{text-align:center;padding-top:20px}
.espera .ico{font-size:5rem}
.alvo{width:140px;height:140px;margin:16px auto;border-radius:50%;border:6px solid var(--sinal);position:relative}
.alvo::after{content:"";position:absolute;inset:46px;border-radius:50%;background:var(--sinal)}
@media (prefers-reduced-motion:no-preference){.alvo{animation:pulso 1.4s ease-in-out infinite}}
@keyframes pulso{50%{transform:scale(.88);opacity:.7}}
.barra{height:16px;border-radius:8px;background:var(--line);overflow:hidden;margin:16px 0}
.barra i{display:block;height:100%;width:0;background:var(--sinal);transition:width .9s linear}

.feito{text-align:center;padding-top:30px}
.check{width:200px;height:200px;margin:0 auto;border-radius:50%;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;font-size:7rem;line-height:1}
.feito .ico{font-size:3rem;margin-top:16px}
.feito .hr{font-family:var(--cond);font-weight:700;font-size:3rem}

.obra{background:var(--card);border-left:8px solid var(--sinal);border-radius:8px;padding:10px 14px;margin:12px 0;font-weight:700;font-size:1.2rem}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.foto{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:2px solid var(--line);background:var(--card);padding:0}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto .lixo{position:absolute;top:4px;right:4px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.foto.conf::after{content:"🗑️";position:absolute;inset:0;background:rgba(192,57,43,.85);display:flex;align-items:center;justify-content:center;font-size:3rem}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.acao{border:0;border-radius:16px;min-height:120px;color:#fff;font-size:3.4rem;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.acao small{font-family:var(--cond);font-weight:700;font-size:1.2rem}
.acao.cam{background:var(--azul)}
.acao.mic{background:var(--ink);color:var(--bg)}
.acao.mic.gravando{background:var(--vermelho);color:#fff}
@media (prefers-reduced-motion:no-preference){.acao.mic.gravando{animation:pulsa 1s ease-in-out infinite}}
@keyframes pulsa{50%{filter:brightness(1.25)}}
.audios{display:grid;gap:8px;margin-top:12px}
.aud{display:grid;grid-template-columns:72px 1fr 64px;gap:8px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:6px}
.aud button{height:56px;border-radius:10px;border:0;font-size:1.6rem;background:var(--bg)}
.aud .t{font-weight:700;font-size:1.2rem;text-align:center}
.aud.conf{border-color:var(--vermelho)}
.aud.conf .del{background:var(--vermelho);color:#fff}
.clima{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.cl{border:3px solid var(--line);background:var(--card);border-radius:12px;min-height:76px;font-size:2.2rem;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.cl small{font-size:.75rem;font-weight:600;color:var(--muted)}
.cl[aria-pressed=true]{border-color:var(--ink);background:var(--sinal)}
.cl[aria-pressed=true] small{color:#1B2420}
.texto-bt{display:block;margin:16px auto 0;background:transparent;border:2px dashed var(--line);border-radius:10px;padding:10px 16px;font-weight:600;color:var(--muted)}
textarea,input[type=text],input[type=password]{width:100%;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 14px;min-height:52px}
textarea{min-height:110px;margin-top:10px}

label{display:block;font-weight:600;margin:14px 0 6px}
.dica{color:var(--muted);font-size:.92rem}
.erro{color:var(--vermelho);font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:14px;min-height:56px;font-weight:700;margin-top:12px}
.btn.primario{background:var(--ink);color:var(--bg)}
.btn.sec{background:transparent;border:2px solid var(--line)}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lista li{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.95rem}
.ok{color:var(--verde);font-weight:700}.pd{color:var(--vermelho);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:700;max-width:90%;z-index:10;font-size:1.3rem}
</style>
</head>
<body>
<header class="topo">
  <div class="marca">Ponto de Campo</div>
  <button id="bt-nuvem" class="nuvem" type="button" aria-label="Situação do envio"><span id="nv-ico">☁️</span><span id="nv-num" class="badge" hidden></span></button>
</header>

<main>
  <!-- Configuração do aparelho: feita pelo responsável -->
  <section id="v-login" class="vista" hidden>
    <h2>Configurar este aparelho</h2>
    <p class="dica">Tela preenchida pelo responsável, uma única vez, com internet. Depois disso o colaborador só usa os botões.</p>
    <p id="nao-config" class="erro" hidden>O app ainda não foi configurado (endereço da planilha).</p>
    <label for="lg-id">ID do colaborador</label>
    <input id="lg-id" type="text" inputmode="numeric" autocomplete="off" maxlength="20">
    <label for="lg-pin">PIN</label>
    <input id="lg-pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
    <p id="lg-erro" class="erro" hidden></p>
    <button id="bt-entrar" class="btn primario" type="button">Entrar</button>
  </section>

  <!-- Tela inicial -->
  <section id="v-inicio" class="vista" hidden>
    <div class="placa"><div class="hora" id="hora">--:--</div><div class="data" id="data"></div></div>
    <div class="quem"><span class="avatar" id="ini-letra" aria-hidden="true"></span><div><b id="ini-nome"></b><small id="ini-obra"></small></div></div>
    <div id="ini-bloq" class="bloq" hidden aria-label="Acesso desativado">⛔</div>
    <div id="ini-botoes">
      <button id="bt-ponto" class="mega ponto" type="button"><span class="ico" aria-hidden="true">🕒</span>PONTO</button>
      <button id="bt-servico" class="mega servico" type="button"><span class="ico" aria-hidden="true">📷</span>SERVIÇO</button>
    </div>
    <div class="hoje" id="hoje" aria-label="Pontos de hoje"></div>
    <button id="bt-config" class="engrenagem" type="button" aria-label="Área do responsável">⚙️</button>
  </section>

  <!-- Escolha do ponto -->
  <section id="v-ponto" class="vista" hidden>
    <button class="voltar" data-inicio type="button" aria-label="Voltar">⬅️</button>
    <div class="tiles" id="tiles"></div>
  </section>

  <!-- Buscando localização -->
  <section id="v-gps" class="vista espera" hidden>
    <div class="ico" id="gps-ico" aria-hidden="true"></div>
    <div class="alvo" aria-hidden="true"></div>
    <div class="ico" aria-label="Buscando localização">📍</div>
    <div class="barra"><i id="gps-barra"></i></div>
    <button class="voltar" id="bt-gps-cancelar" type="button" aria-label="Cancelar">⬅️</button>
  </section>

  <!-- Confirmação -->
  <section id="v-feito" class="vista feito" hidden>
    <div class="check" aria-label="Salvo">✔</div>
    <div class="ico" id="feito-ico" aria-hidden="true"></div>
    <div class="hr" id="feito-hora"></div>
    <button class="voltar" data-inicio type="button" aria-label="Voltar ao início" style="margin-top:20px">🏠</button>
  </section>

  <!-- Relatório de serviço -->
  <section id="v-servico" class="vista" hidden>
    <button class="voltar" data-inicio type="button" aria-label="Voltar">⬅️</button>
    <div class="obra" id="sv-obra"></div>
    <div class="fotos" id="sv-fotos"></div>
    <div class="acoes">
      <button id="bt-cam" class="acao cam" type="button" aria-label="Tirar foto">📷<small>FOTO</small></button>
      <button id="bt-mic" class="acao mic" type="button" aria-label="Gravar áudio"><span id="mic-ico">🎤</span><small id="mic-txt">FALAR</small></button>
    </div>
    <div class="audios" id="sv-audios"></div>
    <div class="clima" id="sv-clima" aria-label="Clima"></div>
    <button id="bt-texto" class="texto-bt" type="button">✏️ Escrever (opcional)</button>
    <textarea id="sv-desc" maxlength="4000" placeholder="Descreva o serviço, se quiser" hidden></textarea>
    <button id="bt-enviar-sv" class="mega enviar" type="button" aria-label="Enviar relatório" disabled><span class="ico" aria-hidden="true">✅</span>PRONTO</button>
    <input type="file" id="in-cam" accept="image/*" capture="environment" hidden>
  </section>

  <!-- Área do responsável -->
  <section id="v-config" class="vista" hidden>
    <button class="voltar" data-inicio type="button" aria-label="Voltar">⬅️</button>
    <h2>Área do responsável</h2>
    <p id="cf-status"></p>
    <button id="bt-sync" class="btn primario" type="button">Enviar agora</button>
    <h2>Relatórios deste aparelho</h2>
    <ul class="lista" id="cf-rels"></ul>
    <h2>Pontos deste aparelho</h2>
    <ul class="lista" id="cf-pontos"></ul>
    <button id="bt-exportar" class="btn sec" type="button">Exportar backup do ponto (CSV)</button>
    <button id="bt-sair" class="btn sec" type="button">Desconectar colaborador deste aparelho</button>
  </section>
</main>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
'use strict';

/* ====== CONFIGURAÇÃO ====== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbzzNMzrz0DjrXYQ7Fog5RlXCuOeYL11nTI8eXJ1mvEXr_hX3AKtwLxMos9TGicc4PZt/exec',
  TOKEN:   'pc-q8Rt2wLx-Bz47'
};
/* ========================== */

const K = {team:'pc_equipe', me:'pc_usuario', obras:'pc_obras', queue:'pc_fila', hist:'pc_hist', dev:'pc_aparelho', seq:'pc_seq', last:'pc_ultima', sync:'pc_ultimo_envio', draft:'pc_rascunho'};
const TIPOS = [
  {id:'entrada',           nome:'CHEGUEI',  ico:'☀️'},
  {id:'saida_intervalo',   nome:'ALMOÇO',   ico:'🍽️'},
  {id:'retorno_intervalo', nome:'VOLTEI',   ico:'🔨'},
  {id:'saida',             nome:'FUI EMBORA', ico:'🏠'}
];
const CLIMAS = [
  {v:'Bom', ico:'☀️', r:'Sol'},
  {v:'Nublado', ico:'⛅', r:'Nublado'},
  {v:'Chuva', ico:'🌧️', r:'Chuva'},
  {v:'Chuva impediu o serviço', ico:'⛔', r:'Parou'}
];
const MAX_FOTOS = 12, MAX_AUDIOS = 5, MAX_SEG_AUDIO = 300;

const $ = s => document.querySelector(s);
let me = null, tipoSel = null, watchId = null, melhor = null, gpsTimer = null, gpsInicio = 0, registrando = false;
let enviando = false, falhou = false, relPend = 0, voltaTimer = null;
let draft = null, svWatch = null, gravador = null, gravInicio = 0, gravTimer = null, tocando = null;
const urls = {};

/* ---------- utilidades ---------- */
function ler(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function gravar(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }
function uid(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x' ? r : (r&3|8)).toString(16); });
}
function aparelho(){ let d = ler(K.dev, null); if(!d){ d = uid().slice(0,8); gravar(K.dev, d); } return d; }
async function sha256(s){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('');
}
const pad2 = n => String(n).padStart(2, '0');
const hora = d => d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
const completo = d => d.toLocaleString('pt-BR');
const hojeISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); };
const isoBr = s => { const p = String(s).split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : s; };
const tipoDe = id => TIPOS.find(t => t.id === id) || {nome:id, ico:'🕒'};
const mesmoDia = (a, b) => a.toDateString() === b.toDateString();
const configurado = () => /^https:\/\//.test(CONFIG.API_URL);
const mmss = s => Math.floor(s / 60) + ':' + pad2(s % 60);
function toast(msg, ms){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, ms || 2500); }
function ver(id){ clearTimeout(voltaTimer); document.querySelectorAll('.vista').forEach(s => s.hidden = s.id !== id); window.scrollTo(0,0); }
function b64(blob){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = () => rej(r.error); r.readAsDataURL(blob); }); }
function extAudio(m){ return /mp4|m4a|aac/.test(m) ? 'm4a' : /ogg/.test(m) ? 'ogg' : 'webm'; }
function sinalOk(){
  try{ if (navigator.vibrate) navigator.vibrate([120, 60, 120]); }catch(e){}
  try{
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const ctx = new C(), t0 = ctx.currentTime;
    [[880, 0], [1320, 0.16]].forEach(([f, d]) => {
      const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = f; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.25, t0 + d); g.gain.exponentialRampToValueAtTime(0.001, t0 + d + 0.15);
      o.start(t0 + d); o.stop(t0 + d + 0.16);
    });
    setTimeout(() => ctx.close(), 600);
  }catch(e){}
}

/* ---------- banco local (relatórios, fotos e áudios) ---------- */
const IDB = {
  db: null,
  open(){
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('sem indexedDB'));
      const r = indexedDB.open('pontoCampo', 1);
      r.onupgradeneeded = () => { const d = r.result;
        if (!d.objectStoreNames.contains('rel')) d.createObjectStore('rel', {keyPath:'id'});
        if (!d.objectStoreNames.contains('arq')) d.createObjectStore('arq', {keyPath:'id'}); };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(store, modo, fn){
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, modo); let out; const r = fn(t.objectStore(store));
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  put(s, v){ return this.tx(s, 'readwrite', o => o.put(v)); },
  get(s, k){ return this.tx(s, 'readonly', o => o.get(k)); },
  all(s){ return this.tx(s, 'readonly', o => o.getAll()); },
  del(s, k){ return this.tx(s, 'readwrite', o => o.delete(k)); }
};

/* ---------- relógio ---------- */
function tique(){
  const d = new Date(); $('#hora').textContent = hora(d);
  $('#data').textContent = d.toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'2-digit'}).replace('.', '');
}

/* ---------- configuração do aparelho (responsável) ---------- */
function erroLogin(msg){ const e = $('#lg-erro'); e.textContent = msg; e.hidden = false; }
async function entrar(){
  const id = $('#lg-id').value.trim(), pin = $('#lg-pin').value.trim();
  $('#lg-erro').hidden = true;

function iniciarGps(){
  ver('v-gps'); $('#gps-ico').textContent = tipoDe(tipoSel).ico;
  melhor = null; registrando = false; gpsInicio = Date.now(); $('#gps-barra').style.width = '0';
  if (!('geolocation' in navigator)){ setTimeout(() => registrar(null), 800); return; }
  watchId = navigator.geolocation.watchPosition(p => {
    if (!melhor || p.coords.accuracy < melhor.coords.accuracy) melhor = p;
    if (melhor.coords.accuracy <= 25) registrar(melhor);
  }, err => { if (err.code === 1) setTimeout(() => registrar(null), 1200); },
  {enableHighAccuracy:true, maximumAge:0, timeout:120000});
  gpsTimer = setInterval(() => {
    const s = (Date.now() - gpsInicio) / 1000;
    $('#gps-barra').style.width = Math.min(100, s / 60 * 100) + '%';
    if (s >= 30 && melhor) registrar(melhor);   // 30 s: fica com a melhor posição obtida
    else if (s >= 60) registrar(null);          // 60 s sem sinal: salva sem localização
  }, 1000);
}
function pararGps(){ if (watchId !== null) navigator.geolocation.clearWatch(watchId); watchId = null; clearInterval(gpsTimer); }
function registrar(pos){
  if (registrando) return; registrando = true; pararGps();
  const agora = new Date(), ult = ler(K.last, 0), seq = ler(K.seq, 0) + 1;
  const m = {
    id: uid(), colabId: me.id, colabNome: me.nome, tipo: tipoSel,

    lng: pos ? +pos.coords.longitude.toFixed(6) : null,
    precisao: pos ? Math.round(pos.coords.accuracy) : null,
    gpsHora: pos ? new Date(pos.timestamp).toISOString() : null,
    obs: me.obra ? me.obra.nome : '',
    aparelho: aparelho(), seq: seq,
    relogioSuspeito: agora.getTime() < ult - 60000
  };
  const fila = ler(K.queue, []); fila.push(m);
  const hist = ler(K.hist, []); hist.push(Object.assign({enviado:false}, m));
  if (!gravar(K.queue, fila) || !gravar(K.hist, hist.slice(-500))){
    alert('Memória do aparelho cheia. Avise o responsável.'); registrando = false; iniciarTela(); return;
  }
  gravar(K.seq, seq); gravar(K.last, Math.max(ult, agora.getTime()));

/* ---------- serviço (RDO) com rascunho salvo a cada passo ---------- */
function salvarRascunho(){ gravar(K.draft, draft); }
async function abrirServico(){
  if (!me || me.bloqueado) return;
  if (!window.indexedDB){ alert('Este navegador não permite guardar fotos. Use o Chrome atualizado.'); return; }
  draft = ler(K.draft, null);
  if (!draft || draft.colabId !== me.id){ draft = {id: uid(), colabId: me.id, fotos: [], audios: [], clima: '', desc: '', pos: null}; salvarRascunho(); }

async function urlDe(id){
  if (urls[id]) return urls[id];
  const r = await IDB.get('arq', id); if (!r) return null;
  urls[id] = URL.createObjectURL(r.blob); return urls[id];
}
function liberarUrl(id){ if (urls[id]){ URL.revokeObjectURL(urls[id]); delete urls[id]; } }
function atualizarPronto(){ $('#bt-enviar-sv').disabled = !(draft && (draft.fotos.length || draft.audios.length)) || !!gravador; }

function gpsServico(){
  if (!('geolocation' in navigator) || svWatch !== null) return;
  const inicio = Date.now();
  svWatch = navigator.geolocation.watchPosition(p => {
    if (!draft) return;
    if (!draft.pos || p.coords.accuracy < draft.pos.precisao){
      draft.pos = {lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), precisao: Math.round(p.coords.accuracy)};
      salvarRascunho();
    }
    if (draft.pos.precisao <= 25 || Date.now() - inicio > 90000) pararGpsServico();
  }, () => {}, {enableHighAccuracy:true, maximumAge:60000, timeout:120000});
}
function pararGpsServico(){ if (svWatch !== null){ navigator.geolocation.clearWatch(svWatch); svWatch = null; } }

/* fotos: reduz e grava obra, data, hora e local na imagem */
function carregarImg(file){
  return new Promise((res, rej) => { const img = new Image(); const u = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(u); res(img); }; img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); }; img.src = u; });
}
async function carimbar(file){
  let src;
  try{ src = await createImageBitmap(file, {imageOrientation:'from-image'}); }catch(e){ src = await carregarImg(file); }
  const w0 = src.width, h0 = src.height, esc = Math.min(1, 1600 / Math.max(w0, h0));
  const w = Math.round(w0 * esc), h = Math.round(h0 * esc);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(src, 0, 0, w, h);
  const linhas = [
    me.obra ? me.obra.nome : 'Obra não definida',
    completo(new Date()),
    draft.pos ? (draft.pos.lat + ', ' + draft.pos.lng + ' (± ' + draft.pos.precisao + ' m)') : 'Sem localização',
    me.nome
  ];
  const fs = Math.max(14, Math.round(Math.min(w, h) * 0.032)), padd = Math.round(fs * 0.6), alt = linhas.length * fs * 1.3 + padd * 2;
  x.fillStyle = 'rgba(0,0,0,0.6)'; x.fillRect(0, h - alt, w, alt);
  x.font = '600 ' + fs + 'px sans-serif'; x.textBaseline = 'top';
  linhas.forEach((l, i) => { x.fillStyle = i === 0 ? '#F2B705' : '#FFFFFF'; x.fillText(l, padd, h - alt + padd + i * fs * 1.3, w - padd * 2); });
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.8));
}
async function novaFoto(file){

}
async function removerArquivo(lista, id){

/* áudio */
function mimeAudio(){
  if (!window.MediaRecorder || !navigator.mediaDevices) return null;
  const c = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
  if (MediaRecorder.isTypeSupported) for (const m of c) if (MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
function renderMic(){
  const b = $('#bt-mic');
  if (gravador){
    const s = Math.floor((Date.now() - gravInicio) / 1000);
    b.classList.add('gravando'); $('#mic-ico').textContent = '⏹️'; $('#mic-txt').textContent = mmss(s);
    b.setAttribute('aria-label', 'Parar gravação');
  } else {
    b.classList.remove('gravando'); $('#mic-ico').textContent = '🎤'; $('#mic-txt').textContent = 'FALAR';
    b.setAttribute('aria-label', 'Gravar áudio');
    b.disabled = !!draft && draft.audios.length >= MAX_AUDIOS;
  }
}
async function microfone(){
  if (gravador){ gravador.stop(); return; }
  if (draft.audios.length >= MAX_AUDIOS) return;
  pararAudio();
  const mime = mimeAudio();
  if (mime === null){ toast('❌ 🎤', 3000); return; }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast('🎤 🚫', 3000); return; }
  const partes = []; let rec;
  try{ rec = new MediaRecorder(stream, mime ? {mimeType: mime, audioBitsPerSecond: 32000} : undefined); }
  catch(e){ rec = new MediaRecorder(stream); }
  rec.ondataavailable = e => { if (e.data && e.data.size) partes.push(e.data); };
  rec.onstop = async () => {
    stream.getTracks().forEach(t => t.stop()); clearInterval(gravTimer);
    const tipo = (rec.mimeType || mime || 'audio/webm').split(';')[0];
    const blob = new Blob(partes, {type: tipo}), dur = Math.round((Date.now() - gravInicio) / 1000);
    gravador = null;
    if (draft && blob.size > 0 && dur >= 1){
      const id = uid();
      try{ await IDB.put('arq', {id, blob}); draft.audios.push({id, mime: tipo, dur}); salvarRascunho(); if (navigator.vibrate) navigator.vibrate(80); }
      catch(e){ toast('❌ 🎤', 3000); }
    }
    renderMic(); await renderAudios(); atualizarPronto();
  };
  gravador = rec; gravInicio = Date.now(); rec.start(1000);
  if (navigator.vibrate) navigator.vibrate(60);
  renderMic(); atualizarPronto();
  gravTimer = setInterval(() => { renderMic(); if ((Date.now() - gravInicio) / 1000 >= MAX_SEG_AUDIO && gravador) gravador.stop(); }, 500);
}
function pararAudio(){ if (tocando){ tocando.a.pause(); tocando.b.textContent = '▶️'; tocando = null; } }
async function renderAudios(){
  const box = $('#sv-audios'); box.textContent = '';

    const t = document.createElement('span'); t.className = 't'; t.textContent = '🎤 ' + mmss(a.dur || 0);
    const del = document.createElement('button'); del.type = 'button'; del.className = 'del'; del.textContent = '🗑️'; del.setAttribute('aria-label', 'Apagar áudio ' + (n + 1) + '. Toque duas vezes');
    play.addEventListener('click', () => {
      if (tocando && tocando.id === a.id){ pararAudio(); return; }
      pararAudio(); const au = new Audio(u); tocando = {id: a.id, a: au, b: play}; play.textContent = '⏸️';
      au.onended = () => pararAudio(); au.play().catch(() => pararAudio());
    });
    del.addEventListener('click', async () => {

/* ---------- envio ---------- */
async function post(obj, ms){
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), ms || 30000);
  try{
    const r = await fetch(CONFIG.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(obj), signal: ctrl.signal});
    const j = await r.json();
    if (!j.ok) throw new Error(j.erro || 'servidor');
    return j;
  } finally { clearTimeout(t); }
}
async function enviarPontos(){
  let algo = false;
  for (let i = 0; i < 20; i++){
    const fila = ler(K.queue, []); if (!fila.length) break;
    const j = await post({acao:'marcar', token: CONFIG.TOKEN, marcacoes: fila.slice(0, 200)}, 25000);
    const rec = new Set(j.recebidos || []); if (!rec.size) break;
    gravar(K.queue, ler(K.queue, []).filter(m => !rec.has(m.id)));
    const h = ler(K.hist, []); h.forEach(x => { if (rec.has(x.id)) x.enviado = true; }); gravar(K.hist, h);
    algo = true;
  }
  return algo;
}
async function enviarRelatorios(){
  let algo = false, lista;
  try{ lista = (await IDB.all('rel')).filter(r => !r.enviado).sort((a, b) => a.criado.localeCompare(b.criado)); }catch(e){ return false; }
  for (const r of lista){
    for (const a of r.arquivos){
      if (a.enviado) continue;
      const reg = await IDB.get('arq', a.id);
      if (!reg){ a.enviado = true; a.perdido = true; await IDB.put('rel', r); continue; }
      const dados = await b64(reg.blob);
      const j = await post({acao:'arquivo', token: CONFIG.TOKEN, relId: r.id, arqId: a.id, nome: a.nome, mime: a.mime, dados, obra: r.obra, data: r.data, colabNome: r.colabNome}, 120000);
      a.enviado = true; a.url = j.url; await IDB.put('rel', r); algo = true;
    }
    await post({acao:'relatorio', token: CONFIG.TOKEN, rel: r}, 30000);
    r.enviado = true; r.enviadoEm = new Date().toISOString(); await IDB.put('rel', r);
    for (const a of r.arquivos){ try{ await IDB.del('arq', a.id); }catch(e){} }
    algo = true; await contarPend(); renderNuvem();
  }
  return algo;
}
async function contarPend(){ try{ relPend = (await IDB.all('rel')).filter(r => !r.enviado).length; }catch(e){ relPend = 0; } }
function renderNuvem(){
  const n = ler(K.queue, []).length + relPend;
  $('#nv-ico').textContent = enviando ? '⏳' : n ? '☁️' : '✅';
  $('#nv-num').hidden = !n; $('#nv-num').textContent = n;
  $('#bt-nuvem').setAttribute('aria-label', n ? n + ' registros aguardando envio' : 'Tudo enviado');
}
async function enviar(manual){
  if (enviando || !configurado()) return;
  enviando = true; renderNuvem();
  let algo = false;
  try{
    const conectou = me ? await atualizarPerfil() : true;
    algo = (await enviarPontos()) || algo;
    algo = (await enviarRelatorios()) || algo;
    if (algo) gravar(K.sync, new Date().toISOString());
    falhou = !conectou && !algo;
    if (manual) toast(falhou ? '📵' : '✅', 2000);
  }catch(e){ falhou = true; if (manual) toast('📵', 2000); }
  finally{ enviando = false; await contarPend(); renderNuvem(); if (!$('#v-config').hidden) abrirConfig(); }
}

/* ---------- área do responsável ---------- */
async function abrirConfig(){
  await contarPend();
  const s = ler(K.sync, null), n = ler(K.queue, []).length;
  $('#cf-status').textContent = (me ? me.nome + ' (ID ' + me.id + '). ' : '') + n + ' ponto(s) e ' + relPend + ' relatório(s) aguardando envio. ' +
    (s ? 'Última sincronização: ' + completo(new Date(s)) + '.' : 'Nunca sincronizado.') + (falhou ? ' Sem conexão no momento.' : '');
  const ulr = $('#cf-rels'); ulr.textContent = '';
  let rels = [];
  try{ rels = (await IDB.all('rel')).filter(r => me && r.colabId === me.id).sort((a, b) => b.criado.localeCompare(a.criado)).slice(0, 20); }catch(e){}
  if (!rels.length){ const li = document.createElement('li'); li.textContent = 'Nenhum.'; ulr.append(li); }
  rels.forEach(r => {
    const li = document.createElement('li'), env = r.arquivos.filter(a => a.enviado).length;
    const st = document.createElement('span'); st.className = r.enviado ? 'ok' : 'pd';
    st.textContent = r.enviado ? 'Enviado' : 'Pendente (' + env + '/' + r.arquivos.length + ' anexos)';
    li.append(document.createTextNode(isoBr(r.data) + ', ' + r.obra + ': '), st); ulr.append(li);
  });
  const ul = $('#cf-pontos'); ul.textContent = '';
  const h = ler(K.hist, []).filter(m => me && m.colabId === me.id).slice(-30).reverse();
  if (!h.length){ const li = document.createElement('li'); li.textContent = 'Nenhum.'; ul.append(li); }
  h.forEach(m => {
    const li = document.createElement('li'), st = document.createElement('span');
    st.className = m.enviado ? 'ok' : 'pd'; st.textContent = m.enviado ? 'Enviado' : 'Pendente';
    li.append(document.createTextNode(tipoDe(m.tipo).ico + ' ' + completo(new Date(m.horaAparelho)) + ': '), st); ul.append(li);
  });
  ver('v-config');
}
function exportar(){
  const h = ler(K.hist, []).filter(m => me && m.colabId === me.id);
  const lim = v => String(v === null || v === undefined ? '' : v).replace(/[;\r\n]/g, ' ');
  const linhas = ['codigo;colaborador;tipo;data_hora_aparelho;latitude;longitude;precisao_m;enviado']
    .concat(h.map(m => [m.id, m.colabNome, tipoDe(m.tipo).nome, completo(new Date(m.horaAparelho)), m.lat, m.lng, m.precisao, m.enviado ? 'sim' : 'não'].map(lim).join(';')));
  const blob = new Blob(['\ufeff' + linhas.join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'ponto-backup-' + aparelho() + '-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.append(a); a.click(); a.remove();
}
async function limparAntigos(){
  try{
    const limite = Date.now() - 60 * 86400000;
    for (const r of await IDB.all('rel')) if (r.enviado && new Date(r.enviadoEm || r.criado).getTime() < limite) await IDB.del('rel', r.id);
  }catch(e){}
}

$('#bt-entrar').addEventListener('click', entrar);
$('#lg-pin').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
$('#bt-ponto').addEventListener('click', abrirPonto);
$('#bt-servico').addEventListener('click', abrirServico);
$('#bt-gps-cancelar').addEventListener('click', () => { pararGps(); ver('v-ponto'); });
document.querySelectorAll('[data-inicio]').forEach(b => b.addEventListener('click', () => {
  if (gravador){ try{ gravador.stop(); }catch(e){} }
  pararAudio(); pararGpsServico();          // o rascunho do serviço continua guardado
  renderInicio(); ver('v-inicio');
}));
$('#bt-cam').addEventListener('click', () => $('#in-cam').click());
$('#in-cam').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; novaFoto(f); });
$('#bt-mic').addEventListener('click', microfone);
$('#bt-texto').addEventListener('click', () => { $('#bt-texto').hidden = true; $('#sv-desc').hidden = false; $('#sv-desc').focus(); });
$('#sv-desc').addEventListener('input', () => { if (draft){ draft.desc = $('#sv-desc').value; salvarRascunho(); } });
$('#bt-enviar-sv').addEventListener('click', enviarServico);
$('#bt-nuvem').addEventListener('click', () => enviar(true));
$('#bt-config').addEventListener('click', abrirConfig);
$('#bt-sync').addEventListener('click', () => enviar(true));
$('#bt-exportar').addEventListener('click', exportar);
$('#bt-sair').addEventListener('click', sair);
window.addEventListener('online', () => enviar(false));
document.addEventListener('visibilitychange', () => { if (!document.hidden) enviar(false); });

localStorage.removeItem(K.team);
tique(); setInterval(tique, 1000);
iniciarTela();
{ const d = ler(K.draft, null); if (me && !me.bloqueado && d && d.colabId === me.id && (d.fotos.length || d.audios.length)) abrirServico(); }   // reabre o serviço se o app foi recarregado pela câmera
contarPend().then(renderNuvem).then(() => enviar(false));
limparAntigos();
setInterval(() => { if (ler(K.queue, []).length || relPend) enviar(false); }, 60000);
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
